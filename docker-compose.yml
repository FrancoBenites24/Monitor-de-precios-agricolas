services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-gemma4:e2b-it-qat}"]
    restart: "no"

  app:
    build:
      context: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      DATASET_PATH: /app/data/mimercado_dataset.csv
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b-it-qat}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-20}
      ALERT_THRESHOLD_PCT: ${ALERT_THRESHOLD_PCT:-5.0}
      DEMO_PRODUCT: ${DEMO_PRODUCT:-Papaya}
      DRY_RUN: ${DRY_RUN:-false}
    restart: "no"

volumes:
  ollama_models:
